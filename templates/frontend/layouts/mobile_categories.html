<div id="mobile-category-menu" class="fixed inset-0 z-[100] hidden">
    <!-- Dark, Blurred Overlay -->
    <div id="category-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm opacity-0 transition-opacity duration-500">
    </div>

    <!-- Menu Drawer (Slide from left or bottom? Let's go with Slide from Bottom for a "Sheet" feel or Right like the menu) -->
    <!-- Let's do Slide from Right to match the other menu but maybe slightly different styling -->
    <div
        class="fixed right-0 top-0 h-full w-[85%] max-w-sm bg-[#09090b]/95 backdrop-blur-2xl shadow-2xl transform translate-x-full offcanvas-transition flex flex-col border-l border-white/10">

        <!-- Header -->
        <div class="flex justify-between items-center p-6 border-b border-white/5">
            <h2 class="text-xl font-bold text-white tracking-tight">Categories</h2>
            <button id="close-category-button"
                class="group p-2 rounded-full border border-white/10 hover:bg-white text-white hover:text-black transition-all duration-300">
                <svg class="w-5 h-5 transition-transform duration-300 group-hover:rotate-90" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-6 no-scrollbar">
            <div class="grid grid-cols-2 gap-4">
                {% for category in categories %}
                <a href="{{ url_for('home.products', category_id=category.id) }}" class="group relative block aspect-square overflow-hidden rounded-2xl bg-white/5 border border-white/5 hover:border-white/20 transition-all">
                    <!-- Image -->
                    {% if category.image %}
                    <img src="{{ url_for('static', filename='images/' + category.image) }}" 
                         alt="{{ category.name }}"
                         class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 opacity-70 group-hover:opacity-100">
                    {% else %}
                    <div class="absolute inset-0 flex items-center justify-center bg-gray-800 text-gray-600">
                        <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                    {% endif %}
                    
                    <!-- Gradient Overlay -->
                    <div class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-black/90 via-black/50 to-transparent"></div>
                    
                    <!-- Text -->
                    <div class="absolute bottom-4 left-4 right-4">
                        <span class="block text-sm font-bold text-white mb-1 leading-tight">{{ category.name }}</span>
                        <!-- Optional: Item count or arrow -->
                        <span class="inline-flex items-center text-[10px] text-gray-300 font-medium uppercase tracking-wider group-hover:text-white transition-colors">
                            Explore
                            <svg class="w-3 h-3 ml-1 transform transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                            </svg>
                        </span>
                    </div>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
