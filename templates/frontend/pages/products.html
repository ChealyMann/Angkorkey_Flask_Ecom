{% extends "frontend/main.html" %} {% block content %}
<style>
    /* Fade Animation */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
    }

    /* Loading Overlay - Fixed CSS */
    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(9, 9, 11, 0.7);
        z-index: 50;
        backdrop-filter: blur(2px);
        /* REMOVED display: flex to prevent conflict with Tailwind hidden */
    }
</style>

<div class="px-4 sm:px-6 lg:px-8 py-8">
    <div id="filtersContainer" class="mb-6 space-y-4">
        <div class="relative max-w-lg mx-auto md:mx-0">
            <input type="text" id="searchInput" placeholder="Search products..."
                class="w-full bg-[#18181b]/50 border border-white/10 rounded-full py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-white/20 transition-all" />
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>

        <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-hide mask-fade-right" id="categoryContainer">
            <button onclick="filterCategory(null, this)"
                class="category-btn whitespace-nowrap px-5 py-2 rounded-full text-xs font-medium border transition-all duration-300 {{ 'bg-white text-black shadow-[0_0_15px_rgba(255,255,255,0.3)] border-transparent scale-105' if not current_category else 'bg-white/5 text-gray-400 border-white/10 hover:bg-white/10 hover:text-white hover:border-white/20' }}">
                All
            </button>

            {% for cat in categories %}
            <button onclick="filterCategory('{{ cat.id }}', this)"
                class="category-btn whitespace-nowrap px-5 py-2 rounded-full text-xs font-medium border transition-all duration-300 {{ 'bg-white text-black shadow-[0_0_15px_rgba(255,255,255,0.3)] border-transparent scale-105' if current_category == cat.id else 'bg-white/5 text-gray-400 border-white/10 hover:bg-white/10 hover:text-white hover:border-white/20' }}">
                {{ cat.name }}
            </button>
            {% endfor %}
        </div>
    </div>

    <div class="relative min-h-[300px]">
        <div id="loadingSpinner"
            class="loading-overlay hidden flex justify-center items-center rounded-xl transition-all duration-300">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-white/20 border-t-white"></div>
        </div>

        <div id="productGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 transition-opacity duration-300">
            {% include 'frontend/layouts/product_grid.html' %}
        </div>

        {# Infinite Scroll Trigger / Loader #}
        <div id="infiniteScrollTrigger" class="py-4 flex justify-center items-center w-full mt-2 opacity-0 transition-opacity duration-300">
            <div class="animate-spin rounded-full h-8 w-8 border-4 border-white/20 border-t-white"></div>
        </div>
    </div>
</div>

<script>
    let currentCategory = {{ current_category if current_category else 'null' }};
    let searchTimeout = null;
    let currentPage = 1;
    let isLoading = false;
    let hasNext = {{ 'true' if pagination.has_next else 'false' }};
    const trigger = document.getElementById('infiniteScrollTrigger');
    const grid = document.getElementById("productGrid");
    const mainLoader = document.getElementById("loadingSpinner");

    // 1. Scroll Listener (Infinite Scroll)
    window.addEventListener('scroll', () => {
        if (isLoading || !hasNext) return;
        
        const rect = trigger.getBoundingClientRect();
        // Load when trigger is within 200px of viewport bottom
        if (rect.top <= window.innerHeight + 200) {
            currentPage++;
            loadProducts(true);
        }
    });

    // 2. Handle Search Input (Debounced)
    document.getElementById("searchInput").addEventListener("input", (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            resetAndLoad();
        }, 400);
    });

    // 3. Handle Category Click
    function filterCategory(catId, btnElement) {
        currentCategory = catId;
        
        // Update Buttons Visuals
        document.querySelectorAll(".category-btn").forEach((btn) => {
            btn.className = "category-btn whitespace-nowrap px-5 py-2 rounded-full text-xs font-medium border transition-all duration-300 bg-white/5 text-gray-400 border-white/10 hover:bg-white/10 hover:text-white hover:border-white/20";
        });
        btnElement.className = "category-btn whitespace-nowrap px-5 py-2 rounded-full text-xs font-medium border transition-all duration-300 bg-white text-black shadow-[0_0_15px_rgba(255,255,255,0.3)] border-transparent scale-105";

        resetAndLoad();
    }

    // 4. Reset & Load (For Filters/Search)
    function resetAndLoad() {
        currentPage = 1;
        hasNext = true;
        // Scroll to top of grid
        const container = document.getElementById("filtersContainer");
        if (container) {
             const y = container.getBoundingClientRect().top + window.pageYOffset - 100;
             window.scrollTo({ top: y, behavior: 'smooth' });
        }
        loadProducts(false);
    }

    // 5. Main Load Function
    async function loadProducts(isAppend) {
        if (isLoading) return;
        isLoading = true;

        if (isAppend) {
            trigger.classList.remove('opacity-0');
        } else {
            mainLoader.classList.remove("hidden");
            grid.style.opacity = "0.3";
            // Check if trigger has "No more products" text and reset it for new search
            trigger.innerHTML = '<div class="animate-spin rounded-full h-8 w-8 border-4 border-white/20 border-t-white"></div>';
            trigger.classList.add('opacity-0'); 
        }

        try {
            const query = document.getElementById("searchInput").value;
            let url = `{{ url_for('home.products') }}?ajax=1&page=${currentPage}`;
            if (query) url += `&search=${encodeURIComponent(query)}`;
            if (currentCategory) url += `&category_id=${currentCategory}`;

            const response = await fetch(url);
            if (!response.ok) throw new Error("Network response was not ok");
            
            const data = await response.json();
            hasNext = data.has_next;

            if (isAppend) {
                grid.insertAdjacentHTML('beforeend', data.html);
            } else {
                grid.innerHTML = data.html;
            }

            // Handle "No More Products" state
            if (!hasNext && currentPage > 1) {
                trigger.innerHTML = '<span class="text-gray-500 text-sm font-medium">No more products to load</span>';
                trigger.classList.remove('opacity-0');
            } else if (!hasNext && currentPage === 1 && data.html.trim().length === 0) {
                 // Handled by the "No products found" in template, hide trigger
                 trigger.classList.add('opacity-0');
            } else if (hasNext) {
                // Keep spinner for next load
                trigger.innerHTML = '<div class="animate-spin rounded-full h-8 w-8 border-4 border-white/20 border-t-white"></div>';
            }

        } catch (error) {
            console.error("Error loading products:", error);
        } finally {
            isLoading = false;
            
            if (isAppend) {
                if (hasNext) trigger.classList.add('opacity-0'); // Hide spinner until next scroll
            } else {
                mainLoader.classList.add("hidden");
                grid.style.opacity = "1";
            }
        }
    }
</script>
{% endblock %}
