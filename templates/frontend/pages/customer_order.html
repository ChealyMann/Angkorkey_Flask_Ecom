{% extends("frontend/main.html") %}

{% block content %}
<main class="px-4 sm:px-6 lg:px-8 py-10 max-w-3xl mx-auto">

    <!-- Title -->
    <h1 class="text-xl font-bold text-white mb-8 text-center">
        My Orders
    </h1>

    <!-- Orders List -->
    <div class="flex flex-col gap-4">

        <!-- Order Card -->
        <div class="bg-[#121214] border border-white/5 rounded-xl p-5 hover:border-white/20 transition">

            <!-- Top Row -->
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-white font-semibold text-sm">
                    Order #1024
                </h3>

                <span class="text-xs px-2 py-1 rounded-md bg-yellow-500/20 text-yellow-400">
                    Pending
                </span>
            </div>

            <!-- Middle Info -->
            <div class="flex justify-between items-center text-xs text-gray-500 mb-4">
                <span>2026-04-01</span>
                <span>3 items</span>
            </div>

            <!-- Bottom -->
            <div class="flex justify-between items-center">
                <span class="text-white font-bold text-sm">$120.00</span>

                <a href="#"
                   class="text-xs bg-white text-black px-3 py-1.5 rounded-md font-semibold hover:opacity-90 transition">
                    View Details
                </a>
            </div>
        </div>

        <!-- Duplicate for preview -->
        <div class="bg-[#121214] border border-white/5 rounded-xl p-5 hover:border-white/20 transition">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-white font-semibold text-sm">Order #1023</h3>
                <span class="text-xs px-2 py-1 rounded-md bg-green-500/20 text-green-400">
                    Completed
                </span>
            </div>

            <div class="flex justify-between text-xs text-gray-500 mb-4">
                <span>2026-03-28</span>
                <span>2 items</span>
            </div>

            <div class="flex justify-between items-center">
                <span class="text-white font-bold text-sm">$89.99</span>
                <a href="{{ url_for('home.customer_order_detail') }}" class="text-xs bg-white text-black px-3 py-1.5 rounded-md font-semibold">
                    View Details
                </a>
            </div>
        </div>

    </div>

</main>
{% endblock %}
