<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Confirm Order</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #09090b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            padding-bottom: 20px; /* Safe area */
        }
        .main-btn {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .secondary-bg {
            background-color: var(--tg-theme-secondary-bg-color, #18181b);
        }
    </style>
</head>
<body class="p-4">

    <!-- Product Summary -->
    <div class="flex flex-col items-center mb-6">
        <div class="w-24 h-24 rounded-2xl overflow-hidden mb-4 border border-white/10 shadow-lg">
            <img src="{{ product.image }}" alt="{{ product.name }}" class="w-full h-full object-cover">
        </div>
        <h1 class="text-xl font-bold text-center mb-1 leading-tight">{{ product.name }}</h1>
        <p class="text-2xl font-bold text-emerald-400">${{ product.price }}</p>
    </div>

    <!-- Order Form -->
    <form id="order-form" class="space-y-4">
        
        <!-- Quantity -->
        <div class="secondary-bg rounded-xl p-3 flex items-center justify-between">
            <label class="text-sm font-medium opacity-70">Quantity</label>
            <div class="flex items-center gap-4">
                <button type="button" onclick="updateQty(-1)" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center active:bg-white/20 transition">-</button>
                <span id="qty-display" class="font-mono font-bold w-4 text-center">1</span>
                <button type="button" onclick="updateQty(1)" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center active:bg-white/20 transition">+</button>
            </div>
        </div>

        <!-- Phone Number -->
        <div class="space-y-1">
            <label for="phone" class="text-xs uppercase tracking-wider font-bold opacity-50 ml-1">Phone Number</label>
            <input type="tel" id="phone" required placeholder="012 345 678"
                class="w-full secondary-bg rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500/50 transition border border-transparent focus:border-blue-500/30 placeholder-white/20">
        </div>

        <!-- Notes -->
        <div class="space-y-1">
            <label for="notes" class="text-xs uppercase tracking-wider font-bold opacity-50 ml-1">Notes (Optional)</label>
            <textarea id="notes" rows="2" placeholder="Size, Color, Delivery instructions..."
                class="w-full secondary-bg rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500/50 transition border border-transparent focus:border-blue-500/30 placeholder-white/20"></textarea>
        </div>
    </form>
    
    <!-- Main Button is handled by Telegram MainButton, but we add a fallback for testing -->
    <button id="html-btn" onclick="submitOrder()" class="main-btn w-full py-4 rounded-xl font-bold text-lg mt-8 shadow-lg active:scale-[0.98] transition-transform hidden">
        Confirm Order - ${{ product.price }}
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Expand to full height

        // Initial Data
        let quantity = 1;
        const basePrice = {{ product.price }};
        const productData = {
            id: {{ product.id }},
            name: "{{ product.name }}",
            price: basePrice
        };

        // Main Button Setup
        tg.MainButton.setText(`PAY $${basePrice}`);
        tg.MainButton.show();

        tg.MainButton.onClick(submitOrder);

        // Update Quantity
        function updateQty(change) {
            quantity += change;
            if (quantity < 1) quantity = 1;
            document.getElementById('qty-display').innerText = quantity;
            
            // Update Main Button Price
            const total = (basePrice * quantity).toFixed(2);
            tg.MainButton.setText(`PAY $${total}`);
        }

        // Submit Order
        function submitOrder() {
            const phone = document.getElementById('phone').value;
            const notes = document.getElementById('notes').value;

            if (!phone) {
                tg.showPopup({
                    title: 'Missing Info',
                    message: 'Please enter your phone number so we can contact you.',
                    buttons: [{type: 'ok'}]
                });
                return;
            }

            const data = {
                product_id: productData.id,
                product_name: productData.name,
                price_per_unit: productData.price,
                quantity: quantity,
                total_price: (productData.price * quantity).toFixed(2),
                phone: phone,
                notes: notes
            };

            // Send data back to bot
            tg.sendData(JSON.stringify(data));
        }

        // --- DEV MODE: If not in Telegram, show HTML button ---
        if (!tg.initData) {
            document.getElementById('html-btn').classList.remove('hidden');
            document.getElementById('html-btn').innerText = `PAY $${basePrice} (Test Mode)`;
        }
    </script>
</body>
</html>
