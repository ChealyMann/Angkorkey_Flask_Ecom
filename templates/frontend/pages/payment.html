<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay with Bakong</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h2 {
            color: #E3000F; /* Bakong Red */
            margin-top: 0;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .qr-container {
            background: #fff;
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 25px;
        }
        .qr-container img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        .instructions {
            font-size: 14px;
            color: #555;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #E3000F;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Angkorkey</h2>
        <p class="subtitle">Scan to pay with any KHQR app</p>

        <div class="qr-container">
            <img src="{{ url_for('static', filename=qr_filename) }}" alt="KHQR Code">
        </div>

        <div class="instructions">
            <strong>How to pay:</strong><br>
            1. Open your banking app.<br>
            2. Scan this QR code.<br>
            <form action="{{ url_for('payment.check_payment',qr=qr) }}" method="POST">
                <input type="submit" value="Click">
                <input type="hidden" name="qr" value="{{ qr }}">
            </form>
        </div>
    </div>


</body>
</html>
