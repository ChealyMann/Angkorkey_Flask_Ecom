{% extends "frontend/main.html" %}

{% block content %}
<div class="px-4 py-4 md:py-12 pb-24">
    <!-- Page Header -->
    <div class="mb-4 text-center">
        <h1 class="text-xl md:text-4xl font-bold text-white tracking-tight mb-1">Explore Categories</h1>
        {# <p class="text-gray-400 text-xs md:text-base">Browse our premium gear.</p> #}
    </div>

    <!-- Categories Grid -->
    <div class="grid grid-cols-3 gap-3 md:gap-6">
        {% for category in categories %}
        <a href="{{ url_for('home.products', category_id=category.id) }}" 
           class="group relative block aspect-square overflow-hidden rounded-xl md:rounded-2xl bg-[#18181b] border border-white/5 hover:border-white/20 transition-all shadow-lg hover:shadow-indigo-500/10">
            
            <!-- Image -->
            <div class="absolute inset-0 w-full h-full">
                {% if category.image %}
                <img src="{{ url_for('static', filename='images/' + category.image) }}" 
                     alt="{{ category.name }}" 
                     class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-70 group-hover:opacity-100">
                {% else %}
                <div class="w-full h-full flex items-center justify-center bg-white/5 text-gray-700 group-hover:text-gray-500 transition-colors">
                    <svg class="w-8 h-8 md:w-12 md:h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                {% endif %}
            </div>

            <!-- Gradient Overlay -->
            <div class="absolute inset-x-0 bottom-0 h-full md:h-3/4 bg-gradient-to-t from-black/90 via-black/40 to-transparent opacity-90 group-hover:opacity-100 transition-opacity"></div>

            <!-- Content -->
            <div class="absolute inset-0 flex flex-col justify-end p-2 md:p-6">
                <span class="block text-[10px] md:text-xl font-bold text-white text-center md:text-left leading-tight tracking-tight md:mb-1 break-words line-clamp-2">{{ category.name }}</span>
                <span class="hidden md:inline-flex items-center text-xs text-indigo-400 font-bold uppercase tracking-wider opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-2 group-hover:translate-y-0">
                    View
                    <svg class="w-3 h-3 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                    </svg>
                </span>
            </div>
            
            <!-- Hover Glow Effect -->
            <div class="absolute inset-0 ring-1 ring-inset ring-white/10 group-hover:ring-white/30 rounded-xl md:rounded-2xl transition-all duration-500 pointer-events-none"></div>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
